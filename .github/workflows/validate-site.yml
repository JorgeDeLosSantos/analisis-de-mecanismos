name: Validate course site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build slides and notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notes/requirements.txt

      - name: Install dependencies
        working-directory: slides
        run: pnpm install --frozen-lockfile

      - name: Install Jupyter Book 2
        run: python -m pip install -r notes/requirements.txt

      - name: Build slides
        working-directory: slides
        run: pnpm build

      - name: Build notes for GitHub Pages subpath
        working-directory: notes
        env:
          BASE_URL: /analisis-de-mecanismos/apuntes
        run: jupyter book build --html --strict

      - name: Verify build outputs
        run: |
          test -f slides/dist/intro/index.html
          test -f notes/_build/html/index.html
          echo "Generated HTML and figure assets:"
          find notes/_build/html -type f | grep -E '(fig-|cinetica|index[.]html)' | head -n 50 || true
          python - <<'PY'
          from pathlib import Path
          root = Path("notes/_build/html")
          all_files = [p for p in root.rglob("*") if p.is_file()]
          html = [p for p in all_files if p.suffix == ".html"]
          images = [p for p in all_files if p.suffix.lower() in {".svg", ".png", ".jpg", ".jpeg", ".webp"}]
          print(f"Site contains {len(all_files)} files, {len(html)} HTML pages and {len(images)} image files")
          print("Image samples:", [p.relative_to(root).as_posix() for p in images[:15]])
          PY

      - name: Upload notes HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: notes-html-preview
          path: notes/_build/html/
          if-no-files-found: error
