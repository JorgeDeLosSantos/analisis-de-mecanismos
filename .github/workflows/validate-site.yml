name: Validate course site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build slides and notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notes/requirements.txt

      - name: Install dependencies
        working-directory: slides
        run: pnpm install --frozen-lockfile

      - name: Install Jupyter Book 2
        run: python -m pip install -r notes/requirements.txt

      - name: Build slides
        working-directory: slides
        run: pnpm build

      - name: Build notes for GitHub Pages subpath
        working-directory: notes
        env:
          BASE_URL: /analisis-de-mecanismos/apuntes
        run: jupyter book build --html --strict

      - name: Verify build outputs
        run: |
          test -f slides/dist/intro/index.html
          test -f notes/_build/html/index.html

      - name: Upload notes HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: notes-html-preview
          path: notes/_build/html/
          if-no-files-found: error
