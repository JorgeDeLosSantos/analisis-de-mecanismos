<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 460" role="img" aria-labelledby="title desc"><title id="title">Distancia al eje para el momento de inercia</title><desc id="desc">Vista superior de una placa irregular en el plano xy. Un eje z perpendicular atraviesa O; la distancia r desde el eje hasta un elemento de masa dm se mide en el plano y es perpendicular al eje.</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#2563a0"/></marker><marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#647b8a"/></marker><marker id="dim-a" markerWidth="6" markerHeight="6" refX="1.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M6 0L0 3L6 6" fill="none" stroke="#647b8a" stroke-width="1.4"/></marker></defs><rect width="940" height="460" fill="white"/><text x="32" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#233748" font-weight="600">Momento de inercia respecto al eje z</text><text x="33" y="79" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5b7082" >Vista del plano xy · eje z perpendicular a la lámina</text><path d="M202 196 C229 114 340 103 435 119 C547 108 698 155 728 250 C751 317 666 380 560 366 C467 399 338 390 245 344 C202 317 184 256 202 196Z" fill="#e3edf5" stroke="#40566b" stroke-width="2.5"/><line x1="311" y1="322" x2="784" y2="322" stroke="#647b8a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="311" y1="322" x2="311" y2="106" stroke="#647b8a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-gray)"/><text x="795" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#233748" >x</text><text x="299" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#233748" >y</text><path d="M311 322L609 191" fill="none" stroke="#2563a0" stroke-width="3.7" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="438" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#2563a0" font-style="italic" font-weight="600">r</text><circle cx="311" cy="322" r="13" fill="white" stroke="#233748" stroke-width="2.2"/><circle cx="311" cy="322" r="3.5" fill="#233748" stroke="#233748" stroke-width="1"/><text x="269" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#233748" >O</text><text x="331" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#233748" >z</text><circle cx="609" cy="191" r="10" fill="#fce9e7" stroke="#c0574a" stroke-width="2.4"/><circle cx="609" cy="191" r="3" fill="#c0574a" stroke="#c0574a" stroke-width="1"/><text x="626" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#c0574a" font-style="italic">dm</text><rect x="675" y="106" width="220" height="68" rx="9" fill="#f7fafc" stroke="#d8e2e9"/><text x="689" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#233748" >r = distancia</text><text x="689" y="155" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5b7082" >perpendicular al eje z</text><text x="202" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5b7082" >El eje z atraviesa O y sale del plano de la figura (⊙).</text></svg>